<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hornado - administración</title>
<style>
:root{--ink:#1D2A21;--line:#D5DDD3;--g:#2E6B45;--gd:#1F4D31;--y:#E3A92B}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;font:17px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#F1F4EF}
header{display:flex;align-items:center;gap:8px;background:var(--gd);color:#fff;padding:6px 10px;padding-top:calc(6px + env(safe-area-inset-top,0px))}
header h1{font-size:19px;margin:0}
button{font:inherit;cursor:pointer}
#menu{width:46px;height:46px;border:0;border-radius:10px;background:transparent;color:#fff;display:grid;place-items:center}
#frames{flex:1;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none}
iframe.on{display:block}
#drawer{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:300px;background:#fff;transform:translateX(-100%);transition:transform .2s;z-index:20;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 16px;display:flex;flex-direction:column;gap:6px}
body.open #drawer{transform:none}
#drawer h2{margin:0 0 8px 8px;font-size:20px}
#items button{min-height:52px;border:0;border-radius:10px;background:transparent;text-align:left;padding:8px 14px;font-weight:600;color:var(--ink);width:100%}
#items button.on{background:var(--g);color:#fff}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:15}
body.open #scrim{display:block}
button:focus-visible{outline:3px solid var(--y);outline-offset:1px}
@media (prefers-reduced-motion:reduce){#drawer{transition:none}}
</style>
</head>
<body>
<header>
  <button id="menu" aria-label="Abrir menú"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <h1 id="ttl">Pedidos</h1>
</header>
<div id="frames"></div>
<div id="scrim"></div>
<aside id="drawer" aria-label="Menú"><h2>Hornado</h2><div id="items"></div></aside>
<script>
const DOCS={pedidos:"<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Pedidos del hornado<\/title>\n<style>\n:root{--bg:#F1F4EF;--ink:#1D2A21;--mut:#5C6A60;--card:#fff;--line:#D5DDD3;--g:#2E6B45;--gd:#1F4D31;--y:#E3A92B;--r:#B3402F}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,\"Segoe UI\",Roboto,sans-serif;padding-bottom:88px}\n.top{position:sticky;top:0;z-index:5;background:var(--gd);color:#fff;padding:10px 14px}\n.top h1{font-size:19px;margin:0;font-weight:700}\nmain{padding:12px;max-width:640px;margin:0 auto}\n.tab{display:none}.tab.on{display:block}\n.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}\nh2{font-size:18px;margin:0 0 8px}\nlabel{display:block;font-size:15px;color:var(--mut);margin:8px 0 4px}\ninput[type=text],input[type=number],input[type=time],input[type=date],input[type=tel],select,textarea{width:100%;min-height:46px;font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}\ninput:focus,button:focus-visible,select:focus,textarea:focus{outline:3px solid var(--y);outline-offset:1px}\nbutton{font:inherit;min-height:46px;padding:8px 14px;border:0;border-radius:10px;background:var(--g);color:#fff;font-weight:600;cursor:pointer}\nbutton.sec{background:#E6ECE4;color:var(--ink)}\nbutton.del{background:transparent;color:var(--r)}\n.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.row{display:grid;grid-template-columns:90px 1fr 90px;align-items:center;gap:8px;padding:5px 0}\n.st{display:flex;gap:6px}\n.st button{width:46px;padding:0;font-size:24px}\n.st input{text-align:center;padding:4px;min-width:0}\n.sub{text-align:right;color:var(--mut);font-size:15px}\n.chk{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:17px;color:var(--ink)}\n.chk input{width:26px;height:26px}\n.tot{display:flex;justify-content:space-between;font-weight:700;font-size:19px;margin-top:8px;padding-top:8px;border-top:2px solid var(--line)}\n.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}\n.chips button{min-height:42px;background:#E6ECE4;color:var(--ink)}\n.chips button.on{background:var(--g);color:#fff}\n.ord h3{margin:0 0 4px;font-size:18px}\n.ord p{margin:3px 0}\n.debe{background:var(--y);color:#2b2100;border-radius:8px;padding:2px 8px;font-weight:700}\n.ok{opacity:.6}\n.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}\n.hint{font-size:15px;color:var(--mut);margin:4px 0}\nnav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:1fr 1fr;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:6px}\nnav button{background:transparent;color:var(--mut)}\nnav button.on{background:var(--g);color:#fff}\n<\/style>\n<\/head>\n<body>\n<main>\n\n<section class=\"tab on\" id=\"t-lista\">\n  <div class=\"chips\" id=\"fil\"><\/div>\n  <div class=\"card\" id=\"resumen\"><\/div>\n  <div id=\"lista\"><\/div>\n  <div class=\"card\">\n    <div class=\"btns\" style=\"margin-top:0\">\n      <button id=\"shall\">Enviar lista por WhatsApp<\/button>\n      <button class=\"sec\" id=\"exp\">Descargar copia<\/button>\n      <button class=\"sec\" id=\"impb\">Restaurar copia<\/button>\n      <input type=\"file\" id=\"imp\" accept=\"application/json\" hidden>\n    <\/div>\n    <p class=\"hint\">Los pedidos se guardan solo en este celular. Descarga una copia cada semana.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"tab\" id=\"t-nuevo\">\n  <div class=\"card\">\n    <h2 id=\"ftit\">Nuevo pedido<\/h2>\n    <label for=\"n\">Nombre de quien recibe<\/label><input type=\"text\" id=\"n\">\n    <label for=\"t\">Tel\u00e9fono de contacto<\/label><input type=\"tel\" id=\"t\" inputmode=\"tel\">\n    <label for=\"dir\">Direcci\u00f3n de entrega<\/label><input type=\"text\" id=\"dir\">\n    <div class=\"two\">\n      <div><label for=\"f\">Fecha de entrega<\/label><input type=\"date\" id=\"f\"><\/div>\n      <div><label for=\"h\">Hora de entrega<\/label><input type=\"time\" id=\"h\"><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"card\">\n    <h2>Porciones<\/h2>\n    <div id=\"pq\"><\/div>\n    <div class=\"two\" style=\"grid-template-columns:1fr auto;margin-top:8px\"><input type=\"number\" inputmode=\"numeric\" min=\"0\" id=\"otro\" placeholder=\"Otro valor, por ejemplo 30000\" aria-label=\"Otro valor de porci\u00f3n\"><button class=\"sec\" id=\"otrob\">Agregar valor<\/button><\/div>\n    <div class=\"tot\"><span id=\"npor\">0 porciones<\/span><span id=\"tot\">$0<\/span><\/div>\n    <label class=\"chk\"><input type=\"checkbox\" id=\"mote\" checked> Con mote<\/label><label class=\"chk\"><input type=\"checkbox\" id=\"lech\" checked> Con lechuga<\/label><label class=\"chk\"><input type=\"checkbox\" id=\"papa\" checked> Con papa<\/label>\n    <label for=\"vari\">Variaci\u00f3n del plato (si hay)<\/label><textarea id=\"vari\" rows=\"2\" placeholder=\"Por ejemplo: sin lechuga, m\u00e1s papa\"><\/textarea>\n    <label class=\"chk\"><input type=\"checkbox\" id=\"cub\"> Con cubiertos<\/label>\n    <label class=\"chk\"><input type=\"checkbox\" id=\"aji\"> Con aj\u00ed<\/label>\n  <\/div>\n  <div class=\"card\">\n    <h2>Pago<\/h2>\n    <label for=\"pago\">Forma de pago<\/label>\n    <select id=\"pago\"><option>Efectivo<\/option><option>Transferencia<\/option><\/select>\n    <label for=\"ab\">Cu\u00e1nto abona<\/label><input type=\"number\" inputmode=\"numeric\" min=\"0\" id=\"ab\" placeholder=\"0\">\n    <div class=\"tot\"><span>Debe<\/span><span id=\"deb\">$0<\/span><\/div>\n  <\/div>\n  <div class=\"btns\" style=\"margin-bottom:12px\">\n    <button id=\"guardar\">Guardar pedido<\/button>\n    <button class=\"sec\" id=\"cancel\">Cancelar<\/button>\n  <\/div>\n<\/section>\n\n<\/main>\n<nav>\n  <button data-t=\"lista\" class=\"on\">Pedidos<\/button>\n  <button data-t=\"nuevo\">Nuevo pedido<\/button>\n<\/nav>\n\n<script>\nconst KEY='hornado-pedidos-v1',BASE=[12000,15000,20000];\nconst $=s=>document.querySelector(s);\nconst fmt=n=>'$'+Math.round(n).toLocaleString('es-CO');\nconst num=v=>Math.max(0,parseInt(v,10)||0);\nconst esc=t=>String(t).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst iso=d=>d.toLocaleDateString('en-CA');\nconst plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};\nconst fdate=f=>f?new Date(f+'T00:00').toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'}):'Sin fecha';\nconst fhour=h=>h?new Date('2000-01-01T'+h).toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'}):'';\nlet S={orders:[]};\ntry{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.orders)S=s}catch(e){}\nS.precios=S.precios||[];\nconst save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};\nlet F={q:{}},ed=null,fil='pend';\nconst vals=()=>[...new Set([...BASE,...S.precios,...Object.keys(F.q).map(Number)])].sort((a,b)=>a-b);\n\nconst porc=o=>Object.values(o.q).reduce((a,n)=>a+n,0);\nconst total=o=>Object.keys(o.q).reduce((a,v)=>a+o.q[v]*v,0);\nconst deuda=o=>Math.max(0,total(o)-o.ab);\nconst detalle=o=>Object.keys(o.q).map(Number).filter(v=>o.q[v]).sort((a,b)=>a-b).map(v=>o.q[v]+' de '+fmt(v)).join(', ')||'Sin porciones';\nconst ingTxt=o=>{const i=o.ing||{mote:1,lech:1,papa:1},y=[],n=[];[['mote','mote'],['lech','lechuga'],['papa','papa']].forEach(a=>(i[a[0]]?y:n).push(a[1]));return !n.length?'Completo (mote, lechuga y papa)':y.length?'Con '+y.join(' y ')+'. Sin '+n.join(' y '):'Solo hornado, sin mote, lechuga ni papa'};\n\nfunction visibles(){\n  const h=iso(new Date()),s=plus(7);\n  return S.orders.filter(o=>fil==='todos'||(fil==='pend'&&!o.ok)||(fil==='hoy'&&o.f===h)||(fil==='sem'&&o.f>=h&&o.f<=s&&!o.ok))\n    .sort((a,b)=>(a.f+a.h)<(b.f+b.h)?-1:1);\n}\n\nfunction renderFil(){\n  $('#fil').innerHTML=[['pend','Pendientes'],['hoy','Hoy'],['sem','Esta semana'],['todos','Todos']].map(a=>`<button data-f=\"${a[0]}\" class=\"${fil===a[0]?'on':''}\">${a[1]}<\/button>`).join('');\n}\n\nfunction render(){\n  renderFil();\n  const L=visibles(),g={};\n  L.forEach(o=>{const k=o.f||'';g[k]=g[k]||{p:0,t:0};g[k].p+=porc(o);g[k].t+=total(o)});\n  const ks=Object.keys(g).sort();\n  $('#resumen').innerHTML='<h2>Para preparar<\/h2>'+(ks.length?ks.map(k=>`<div class=\"tot\" style=\"font-size:17px;margin-top:6px;padding-top:6px\"><span>${esc(fdate(k))}<\/span><span>${g[k].p} porciones<\/span><\/div>`).join(''):'<p class=\"hint\">No hay pedidos en esta vista.<\/p>');\n  $('#lista').innerHTML=L.map(o=>`<div class=\"card ord ${o.ok?'ok':''}\"><h3>${esc(fdate(o.f))} ${esc(fhour(o.h))} - ${esc(o.n||'Sin nombre')}<\/h3>\n    <p><b>${esc(detalle(o))}<\/b> (${fmt(total(o))})<\/p>\n    <p>${ingTxt(o)}${o.var?'. Variaci\u00f3n: '+esc(o.var):''}<\/p>\n    <p>${o.cub?'Con cubiertos':'Sin cubiertos'}. ${o.aji?'Con aj\u00ed':'Sin aj\u00ed'}.<\/p>\n    <p>${esc(o.dir||'Sin direcci\u00f3n')}${o.t?' - <a href=\"tel:'+esc(o.t.replace(/[^0-9+]/g,''))+'\">'+esc(o.t)+'<\/a>':''}<\/p>\n    <p>${esc(o.pago)}. Abon\u00f3 ${fmt(o.ab)}. ${deuda(o)?'<span class=\"debe\">Debe '+fmt(deuda(o))+'<\/span>':'Pagado completo'}<\/p>\n    <div class=\"btns\"><button data-ok=\"${o.id}\">${o.ok?'Reabrir':'Marcar entregado'}<\/button><button class=\"sec\" data-wa=\"${o.id}\">WhatsApp<\/button><button class=\"sec\" data-ed=\"${o.id}\">Editar<\/button><button class=\"del\" data-del=\"${o.id}\">Borrar<\/button><\/div><\/div>`).join('');\n}\n\nfunction txt(o){\n  return ['PEDIDO - '+(o.n||'Sin nombre'),\n    'Entrega: '+fdate(o.f)+' '+fhour(o.h),\n    'Direcci\u00f3n: '+(o.dir||'-'),'Tel\u00e9fono: '+(o.t||'-'),\n    'Porciones: '+detalle(o)+' (total '+fmt(total(o))+')',\n    ingTxt(o)+(o.var?'. Variaci\u00f3n: '+o.var:''),\n    'Cubiertos: '+(o.cub?'s\u00ed':'no')+'. Aj\u00ed: '+(o.aji?'s\u00ed':'no'),\n    'Pago: '+o.pago+'. Abon\u00f3 '+fmt(o.ab)+'. '+(deuda(o)?'DEBE '+fmt(deuda(o)):'Pagado completo')].join('\\n');\n}\nconst wa=t=>window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');\n\nfunction formCalc(){\n  let p=0,t=0;\n  vals().forEach(v=>{const n=F.q[v]||0;p+=n;t+=n*v;const s=$('#s'+v);if(s)s.textContent=n?fmt(n*v):''});\n  $('#npor').textContent=p+(p===1?' porci\u00f3n':' porciones');\n  $('#tot').textContent=fmt(t);\n  $('#deb').textContent=fmt(Math.max(0,t-num($('#ab').value)));\n}\nfunction buildQ(){\n  $('#pq').innerHTML=vals().map(v=>`<div class=\"row\"><b>${fmt(v)}<\/b><div class=\"st\"><button data-q=\"${v}\" data-s=\"-1\" aria-label=\"Quitar una de ${fmt(v)}\">\u2212<\/button><input type=\"number\" inputmode=\"numeric\" min=\"0\" id=\"q${v}\" data-qi=\"${v}\" value=\"${F.q[v]||''}\" placeholder=\"0\" aria-label=\"Porciones de ${fmt(v)}\"><button data-q=\"${v}\" data-s=\"1\" aria-label=\"Sumar una de ${fmt(v)}\">+<\/button><\/div><span class=\"sub\" id=\"s${v}\"><\/span><\/div>`).join('');\n  formCalc();\n}\nfunction openForm(o){\n  ed=o?o.id:null;\n  F={q:Object.assign({},o?o.q:{})};\n  $('#ftit').textContent=o?'Editar pedido':'Nuevo pedido';\n  $('#n').value=o?o.n:'';$('#t').value=o?o.t:'';$('#dir').value=o?o.dir:'';\n  $('#f').value=o?o.f:plus(7);$('#h').value=o?o.h:'';\n  const gi=o&&o.ing?o.ing:{mote:1,lech:1,papa:1};$('#mote').checked=!!gi.mote;$('#lech').checked=!!gi.lech;$('#papa').checked=!!gi.papa;$('#vari').value=o?o.var:'';\n  $('#cub').checked=o?o.cub:false;$('#aji').checked=o?o.aji:false;\n  $('#pago').value=o?o.pago:'Efectivo';$('#ab').value=o&&o.ab?o.ab:'';\n  buildQ();show('nuevo');\n}\nfunction show(t){\n  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.id==='t-'+t));\n  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));\n  scrollTo(0,0);\n}\n\ndocument.addEventListener('click',e=>{\n  const b=e.target.closest('button');if(!b)return;\n  const d=b.dataset,find=id=>S.orders.find(o=>o.id==id);\n  if(d.t){if(d.t==='nuevo')openForm();else{show('lista');render()}return}\n  if(d.f){fil=d.f;return render()}\n  if(d.s){F.q[d.q]=Math.max(0,(F.q[d.q]||0)+(+d.s));$('#q'+d.q).value=F.q[d.q]||'';return formCalc()}\n  if(d.ok){const o=find(d.ok);o.ok=!o.ok;save();return render()}\n  if(d.wa)return wa(txt(find(d.wa)));\n  if(d.ed)return openForm(find(d.ed));\n  if(d.del){if(confirm('\u00bfBorrar este pedido?')){S.orders=S.orders.filter(o=>o.id!=d.del);save();render()}}\n});\ndocument.addEventListener('input',e=>{\n  if(e.target.dataset.qi){F.q[e.target.dataset.qi]=num(e.target.value);formCalc()}\n  if(e.target.id==='ab')formCalc();\n});\n$('#guardar').onclick=()=>{\n  const o={id:ed||Date.now(),n:$('#n').value.trim(),t:$('#t').value.trim(),dir:$('#dir').value.trim(),f:$('#f').value,h:$('#h').value,\n    q:Object.fromEntries(Object.entries(F.q).filter(e=>e[1]>0)),ing:{mote:$('#mote').checked,lech:$('#lech').checked,papa:$('#papa').checked},var:$('#vari').value.trim(),cub:$('#cub').checked,aji:$('#aji').checked,\n    pago:$('#pago').value,ab:num($('#ab').value),ok:false};\n  if(!o.n&&!o.t){alert('Escribe al menos el nombre o el tel\u00e9fono');return}\n  if(!porc(o)){alert('Agrega al menos una porci\u00f3n');return}\n  if(ed){const old=S.orders.find(x=>x.id==ed);o.ok=old.ok;S.orders=S.orders.map(x=>x.id==ed?o:x)}else S.orders.push(o);\n  save();show('lista');render();\n};\n$('#otrob').onclick=()=>{const v=num($('#otro').value);if(!v)return;if(!BASE.includes(v)&&!S.precios.includes(v)){S.precios.push(v);save()}F.q[v]=F.q[v]||0;$('#otro').value='';buildQ();$('#q'+v).focus()};\n$('#cancel').onclick=()=>{show('lista');render()};\n$('#shall').onclick=()=>{\n  const L=visibles();if(!L.length){alert('No hay pedidos en esta vista');return}\n  wa('PEDIDOS\\n\\n'+L.map(txt).join('\\n\\n---\\n\\n'));\n};\n$('#exp').onclick=()=>{\n  const a=document.createElement('a');\n  a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));\n  a.download='copia-pedidos-'+iso(new Date())+'.json';a.click();\n};\n$('#impb').onclick=()=>$('#imp').click();\n$('#imp').onchange=e=>{\n  const f=e.target.files[0];if(!f)return;\n  const r=new FileReader();\n  r.onload=()=>{try{const s=JSON.parse(r.result);if(!Array.isArray(s.orders))throw 0;S=s;S.precios=S.precios||[];save();render();alert('Copia restaurada')}catch(x){alert('El archivo no es una copia v\u00e1lida')}};\n  r.readAsText(f);\n};\nrender();\n<\/script>\n<\/body>\n<\/html>\n",caja:"<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Cierre de caja del hornado<\/title>\n<style>\n:root{--bg:#F1F4EF;--ink:#1D2A21;--mut:#5C6A60;--card:#fff;--line:#D5DDD3;--g:#2E6B45;--gd:#1F4D31;--y:#E3A92B;--r:#B3402F}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,\"Segoe UI\",Roboto,sans-serif;padding-bottom:88px}\n.top{position:sticky;top:0;z-index:5;background:var(--gd);color:#fff;padding:10px 14px}\n.top h1{font-size:19px;margin:0 0 6px;font-weight:700}\n.sum{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}\n.sum div{background:rgba(255,255,255,.12);border-radius:10px;padding:6px 10px}\n.sum small{display:block;font-size:13px;opacity:.85}\n.sum strong{font-size:18px}\n.sum .gan{background:var(--y);color:#2b2100}\n.sum .gan.neg{background:var(--r);color:#fff}\nmain{padding:12px;max-width:640px;margin:0 auto}\n.tab{display:none}.tab.on{display:block}\n.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}\nh2{font-size:18px;margin:0 0 8px}\nlabel{display:block;font-size:15px;color:var(--mut);margin-bottom:4px}\ninput[type=text],input[type=number],input[type=time],input[type=date],input[type=tel]{width:100%;min-height:46px;font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}\ninput:focus,button:focus-visible{outline:3px solid var(--y);outline-offset:1px}\nbutton{font:inherit;min-height:46px;padding:8px 14px;border:0;border-radius:10px;background:var(--g);color:#fff;font-weight:600;cursor:pointer}\nbutton.sec{background:#E6ECE4;color:var(--ink)}\nbutton.del{background:transparent;color:var(--r);min-height:40px;padding:4px 10px}\n.row{display:grid;grid-template-columns:84px 1fr 86px;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line)}\n.row:first-of-type{border-top:0}\n.row b{font-size:17px}\n.st{display:flex;gap:6px}\n.st button{width:46px;padding:0;font-size:24px}\n.st input{text-align:center;padding:4px;min-width:0}\n.sub{text-align:right;font-size:15px;color:var(--mut)}\n.tot{display:flex;justify-content:space-between;font-weight:700;font-size:19px;margin-top:8px;padding-top:8px;border-top:2px solid var(--line)}\n.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}\n.chips button{min-height:40px;background:#E6ECE4;color:var(--ink)}\n.li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}\n.li span{flex:1;word-break:break-word}\n.li a{color:var(--g);font-weight:700;padding:8px}\n.done span{text-decoration:line-through;color:var(--mut)}\npre{white-space:pre-wrap;font:16px/1.5 ui-monospace,Consolas,monospace;margin:0 0 10px;background:#F6F8F4;border-radius:10px;padding:10px}\n.btns{display:flex;flex-wrap:wrap;gap:8px}\n.hint{font-size:15px;color:var(--mut);margin:6px 0 0}\nnav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:6px}\nnav button{background:transparent;color:var(--mut);padding:6px 2px}\nnav button.on{background:var(--g);color:#fff}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n<\/style>\n<\/head>\n<body>\n<div class=\"top\">\n  \n  <div class=\"sum\">\n    <div><small>Ventas<\/small><strong id=\"vV\">$0<\/strong><\/div>\n    <div><small>Gastos<\/small><strong id=\"vG\">$0<\/strong><\/div>\n    <div class=\"gan\" id=\"vNbox\"><small>Ganancia<\/small><strong id=\"vN\">$0<\/strong><\/div>\n  <\/div>\n<\/div>\n<main>\n\n<section class=\"tab on\" id=\"t-caja\">\n  <div class=\"card\">\n    <label for=\"fecha\">Fecha<\/label>\n    <input type=\"date\" id=\"fecha\">\n  <\/div>\n  <div class=\"card\">\n    <h2>Base inicial<\/h2>\n    <label for=\"base\">Efectivo con el que empez\u00f3 el d\u00eda (para dar cambio)<\/label>\n    <input type=\"number\" inputmode=\"numeric\" min=\"0\" id=\"base\" data-k=\"base\" placeholder=\"0\">\n  <\/div>\n  <div class=\"card\">\n    <h2>Billetes<\/h2>\n    <div id=\"bill\"><\/div>\n  <\/div>\n  <div class=\"card\">\n    <h2>Monedas<\/h2>\n    <div id=\"coin\"><\/div>\n    <div class=\"tot\"><span>Efectivo contado<\/span><span id=\"ef\">$0<\/span><\/div>\n  <\/div>\n  <div class=\"card\">\n    <h2>Pagos por transferencia<\/h2>\n    <div class=\"two\">\n      <div><label for=\"nequi\">Nequi<\/label><input type=\"number\" inputmode=\"numeric\" min=\"0\" id=\"nequi\" data-k=\"nequi\" placeholder=\"0\"><\/div>\n      <div><label for=\"transf\">Bre-B y bancos<\/label><input type=\"number\" inputmode=\"numeric\" min=\"0\" id=\"transf\" data-k=\"transf\" placeholder=\"0\"><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"tab\" id=\"t-gastos\">\n  <div class=\"card\">\n    <h2>Agregar gasto<\/h2>\n    <div class=\"chips\" id=\"chips\"><\/div>\n    <label for=\"gc\">Concepto<\/label>\n    <input type=\"text\" id=\"gc\" placeholder=\"Por ejemplo: cerdo\">\n    <label for=\"gv\" style=\"margin-top:8px\">Valor<\/label>\n    <input type=\"number\" inputmode=\"numeric\" min=\"0\" id=\"gv\" placeholder=\"0\">\n    <button id=\"gadd\" style=\"margin-top:10px;width:100%\">Agregar gasto<\/button>\n  <\/div>\n  <div class=\"card\">\n    <h2>Gastos del d\u00eda<\/h2>\n    <div id=\"glist\"><\/div>\n    <div class=\"tot\"><span>Total gastos<\/span><span id=\"gt\">$0<\/span><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"tab\" id=\"t-apoyo\">\n  <div class=\"card\">\n    <h2>Tiempo de horneado<\/h2>\n    <div class=\"two\">\n      <div><label for=\"hi\">Hora de inicio<\/label><input type=\"time\" id=\"hi\"><\/div>\n      <div><label for=\"hh\">Duraci\u00f3n en horas<\/label><input type=\"number\" inputmode=\"decimal\" step=\"0.25\" min=\"0\" id=\"hh\" placeholder=\"4\"><\/div>\n    <\/div>\n    <div class=\"btns\" style=\"margin-top:8px\"><button class=\"sec\" id=\"hnow\">Empezar ahora<\/button><\/div>\n    <p class=\"tot\" id=\"hl\" style=\"border:0;margin:8px 0 0;padding:0\"><\/p>\n  <\/div>\n  <div class=\"card\">\n    <h2>Recordatorios de compra<\/h2>\n    <div class=\"two\" style=\"grid-template-columns:1fr auto\"><input type=\"text\" id=\"rt\" placeholder=\"Por ejemplo: comprar gas\"><button id=\"radd\">Agregar<\/button><\/div>\n    <div id=\"rlist\"><\/div>\n  <\/div>\n  <div class=\"card\">\n    <h2>Proveedores<\/h2>\n    <label for=\"pn\">Nombre<\/label><input type=\"text\" id=\"pn\" placeholder=\"Por ejemplo: do\u00f1a Rosa, cerdo\">\n    <label for=\"pt\" style=\"margin-top:8px\">Tel\u00e9fono<\/label><input type=\"tel\" id=\"pt\" placeholder=\"3001234567\">\n    <button id=\"padd\" style=\"margin-top:10px;width:100%\">Guardar proveedor<\/button>\n    <div id=\"plist\"><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"tab\" id=\"t-informe\">\n  <div class=\"card\">\n    <h2>Informe del d\u00eda<\/h2>\n    <pre id=\"rep\"><\/pre>\n    <div class=\"btns\">\n      <button id=\"share\">Compartir informe<\/button>\n      <button class=\"sec\" id=\"savedia\">Guardar el d\u00eda<\/button>\n      <button class=\"sec\" id=\"newdia\">Empezar d\u00eda nuevo<\/button>\n    <\/div>\n    <p class=\"hint\">Guardar el d\u00eda lo a\u00f1ade al historial. Empezar d\u00eda nuevo limpia los conteos y gastos, pero conserva la base, los proveedores y los recordatorios.<\/p>\n  <\/div>\n  <div class=\"card\">\n    <h2>Historial<\/h2>\n    <div id=\"hlist\"><\/div>\n  <\/div>\n  <div class=\"card\">\n    <h2>Copia de seguridad<\/h2>\n    <p class=\"hint\" style=\"margin-top:0\">Los datos quedan guardados solo en este celular. Descarga una copia cada semana para no perder el historial.<\/p>\n    <div class=\"btns\" style=\"margin-top:8px\">\n      <button class=\"sec\" id=\"exp\">Descargar copia<\/button>\n      <button class=\"sec\" id=\"impb\">Restaurar copia<\/button>\n      <input type=\"file\" id=\"imp\" accept=\"application/json\" hidden>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\/main>\n<nav>\n  <button data-t=\"caja\" class=\"on\">Caja<\/button>\n  <button data-t=\"gastos\">Gastos<\/button>\n  <button data-t=\"apoyo\">Apoyo<\/button>\n  <button data-t=\"informe\">Informe<\/button>\n<\/nav>\n\n<script>\nconst KEY='hornado-v1';\nconst BILL=[100000,50000,20000,10000,5000,2000];\nconst COIN=[1000,500,200,100,50];\nconst CHIPS=['Cerdo','Mote','Papa','Gas','Bebidas','Ayudantes','Otro'];\nconst $=s=>document.querySelector(s);\nconst fmt=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('es-CO');\nconst num=v=>Math.max(0,parseInt(v,10)||0);\nconst esc=t=>String(t).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst hoy=()=>new Date().toLocaleDateString('en-CA');\nconst def=()=>({fecha:hoy(),base:0,c:{},nequi:0,transf:0,gastos:[],hist:[],prov:[],rec:[],hor:{ini:'',h:''}});\nfunction load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s)return Object.assign(def(),s)}catch(e){}return def()}\nlet S=load();\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}\n\nfunction buildDen(){\n  const mk=a=>a.map(d=>`<div class=\"row\"><b>${fmt(d)}<\/b><div class=\"st\"><button data-d=\"${d}\" data-s=\"-1\" aria-label=\"Quitar uno de ${fmt(d)}\">\u2212<\/button><input type=\"number\" inputmode=\"numeric\" min=\"0\" id=\"c${d}\" data-d=\"${d}\" value=\"${S.c[d]||''}\" placeholder=\"0\" aria-label=\"Cantidad de ${fmt(d)}\"><button data-d=\"${d}\" data-s=\"1\" aria-label=\"Sumar uno de ${fmt(d)}\">+<\/button><\/div><span class=\"sub\" id=\"s${d}\"><\/span><\/div>`).join('');\n  $('#bill').innerHTML=mk(BILL);$('#coin').innerHTML=mk(COIN);\n}\n\nfunction totals(){\n  let ef=0;\n  BILL.concat(COIN).forEach(d=>{const n=S.c[d]||0;ef+=n*d;$('#s'+d).textContent=n?fmt(n*d):''});\n  const g=S.gastos.reduce((a,x)=>a+x.v,0);\n  const v=ef-S.base+S.nequi+S.transf;\n  return{ef,g,v,n:v-g};\n}\n\nfunction calc(){\n  const t=totals();\n  $('#ef').textContent=fmt(t.ef);\n  $('#vV').textContent=fmt(t.v);\n  $('#vG').textContent=fmt(t.g);\n  $('#vN').textContent=fmt(t.n);\n  $('#gt').textContent=fmt(t.g);\n  $('#vNbox').classList.toggle('neg',t.n<0);\n  $('#rep').textContent=report(t);\n  save();\n}\n\nfunction report(t){\n  const l=['Cierre del hornado - '+S.fecha,'',\n    'Efectivo contado: '+fmt(t.ef),\n    'Base inicial (cambio): -'+fmt(S.base),\n    'Nequi: '+fmt(S.nequi),\n    'Bre-B y bancos: '+fmt(S.transf),\n    'VENTAS DEL D\u00cdA: '+fmt(t.v),'','Gastos:'];\n  if(!S.gastos.length)l.push('- (sin gastos)');\n  S.gastos.forEach(x=>l.push('- '+x.c+': '+fmt(x.v)));\n  l.push('Total gastos: '+fmt(t.g),'','GANANCIA DEL D\u00cdA: '+fmt(t.n));\n  return l.join('\\n');\n}\n\nfunction renderG(){\n  $('#glist').innerHTML=S.gastos.length?S.gastos.map((x,i)=>`<div class=\"li\"><span>${esc(x.c)}<\/span><b>${fmt(x.v)}<\/b><button class=\"del\" data-gd=\"${i}\" aria-label=\"Borrar gasto ${esc(x.c)}\">Borrar<\/button><\/div>`).join(''):'<p class=\"hint\">Todav\u00eda no hay gastos. Agrega el primero arriba.<\/p>';\n  calc();\n}\nfunction renderR(){\n  $('#rlist').innerHTML=S.rec.length?S.rec.map((x,i)=>`<div class=\"li ${x.ok?'done':''}\"><input type=\"checkbox\" data-rc=\"${i}\" ${x.ok?'checked':''} aria-label=\"Marcar hecho\" style=\"width:26px;height:26px\"><span>${esc(x.t)}<\/span><button class=\"del\" data-rd=\"${i}\">Borrar<\/button><\/div>`).join(''):'<p class=\"hint\">No hay recordatorios.<\/p>';\n}\nfunction renderP(){\n  $('#plist').innerHTML=S.prov.length?S.prov.map((x,i)=>`<div class=\"li\"><span>${esc(x.n)}<br><small>${esc(x.t)}<\/small><\/span><a href=\"tel:${esc(x.t.replace(/[^0-9+]/g,''))}\">Llamar<\/a><button class=\"del\" data-pd=\"${i}\">Borrar<\/button><\/div>`).join(''):'<p class=\"hint\">No hay proveedores guardados.<\/p>';\n}\nfunction renderH(){\n  $('#hlist').innerHTML=S.hist.length?S.hist.slice().reverse().map(h=>`<div class=\"li\"><span><b>${esc(h.fecha)}<\/b><br><small>Ventas ${fmt(h.v)} - Gastos ${fmt(h.g)}<\/small><\/span><b>${fmt(h.n)}<\/b><button class=\"del\" data-hd=\"${esc(h.fecha)}\">Borrar<\/button><\/div>`).join(''):'<p class=\"hint\">A\u00fan no hay d\u00edas guardados.<\/p>';\n}\nfunction hor(){\n  const p=(S.hor.ini||'').split(':').map(Number);\n  if(p.length<2||isNaN(p[0])||!S.hor.h){$('#hl').textContent='';return}\n  const t=new Date(2000,0,1,p[0],p[1]+Math.round(S.hor.h*60));\n  $('#hl').textContent='Listo a las '+t.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});\n}\n\nfunction setC(d,n){S.c[d]=Math.max(0,n);$('#c'+d).value=S.c[d]||'';calc()}\n\ndocument.addEventListener('click',e=>{\n  const b=e.target.closest('button');if(!b)return;\n  if(b.dataset.s)return setC(+b.dataset.d,(S.c[b.dataset.d]||0)+(+b.dataset.s));\n  if(b.dataset.t){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));$('#t-'+b.dataset.t).classList.add('on');document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));scrollTo(0,0);return}\n  if(b.dataset.chip){$('#gc').value=b.dataset.chip;$('#gv').focus();return}\n  if(b.dataset.gd){S.gastos.splice(+b.dataset.gd,1);return renderG()}\n  if(b.dataset.rd){S.rec.splice(+b.dataset.rd,1);save();return renderR()}\n  if(b.dataset.pd){S.prov.splice(+b.dataset.pd,1);save();return renderP()}\n  if(b.dataset.hd){if(confirm('\u00bfBorrar este d\u00eda del historial?')){S.hist=S.hist.filter(h=>h.fecha!==b.dataset.hd);save();renderH()}}\n});\ndocument.addEventListener('input',e=>{\n  const i=e.target;\n  if(i.dataset.d){S.c[i.dataset.d]=num(i.value);return calc()}\n  if(i.dataset.k){S[i.dataset.k]=num(i.value);return calc()}\n});\ndocument.addEventListener('change',e=>{\n  if(e.target.dataset.rc){S.rec[+e.target.dataset.rc].ok=e.target.checked;save();renderR()}\n});\n\n$('#fecha').addEventListener('change',e=>{S.fecha=e.target.value||hoy();calc()});\n$('#gadd').onclick=()=>{\n  const v=num($('#gv').value);if(!v){$('#gv').focus();return}\n  S.gastos.push({c:$('#gc').value.trim()||'Gasto',v});\n  $('#gc').value='';$('#gv').value='';renderG();\n};\n$('#radd').onclick=()=>{const t=$('#rt').value.trim();if(!t)return;S.rec.push({t,ok:false});$('#rt').value='';save();renderR()};\n$('#padd').onclick=()=>{const n=$('#pn').value.trim(),t=$('#pt').value.trim();if(!n||!t)return;S.prov.push({n,t});$('#pn').value='';$('#pt').value='';save();renderP()};\n$('#hi').addEventListener('input',e=>{S.hor.ini=e.target.value;save();hor()});\n$('#hh').addEventListener('input',e=>{S.hor.h=parseFloat(e.target.value)||'';save();hor()});\n$('#hnow').onclick=()=>{const d=new Date();S.hor.ini=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');$('#hi').value=S.hor.ini;save();hor()};\n\n$('#share').onclick=async()=>{\n  const txt=$('#rep').textContent;\n  try{if(navigator.share){await navigator.share({text:txt})}else{await navigator.clipboard.writeText(txt);alert('Informe copiado')}}catch(e){}\n};\n$('#savedia').onclick=()=>{\n  const t=totals();\n  S.hist=S.hist.filter(h=>h.fecha!==S.fecha);\n  S.hist.push({fecha:S.fecha,v:t.v,g:t.g,n:t.n,ef:t.ef,nequi:S.nequi,transf:S.transf,gastos:S.gastos.slice()});\n  S.hist.sort((a,b)=>a.fecha<b.fecha?-1:1);\n  save();renderH();alert('D\u00eda guardado en el historial');\n};\n$('#newdia').onclick=()=>{\n  if(!confirm('\u00bfEmpezar un d\u00eda nuevo? Se limpian los conteos y gastos actuales. Si no guardaste el d\u00eda, se pierden.'))return;\n  S.c={};S.nequi=0;S.transf=0;S.gastos=[];S.fecha=hoy();\n  init();scrollTo(0,0);\n};\n$('#exp').onclick=()=>{\n  const a=document.createElement('a');\n  a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));\n  a.download='copia-hornado-'+hoy()+'.json';a.click();\n};\n$('#impb').onclick=()=>$('#imp').click();\n$('#imp').onchange=e=>{\n  const f=e.target.files[0];if(!f)return;\n  const r=new FileReader();\n  r.onload=()=>{try{S=Object.assign(def(),JSON.parse(r.result));save();init();alert('Copia restaurada')}catch(x){alert('El archivo no es una copia v\u00e1lida')}};\n  r.readAsText(f);\n};\n\nfunction init(){\n  $('#fecha').value=S.fecha;\n  $('#base').value=S.base||'';$('#nequi').value=S.nequi||'';$('#transf').value=S.transf||'';\n  $('#hi').value=S.hor.ini||'';$('#hh').value=S.hor.h||'';\n  $('#chips').innerHTML=CHIPS.map(c=>`<button data-chip=\"${c}\">${c}<\/button>`).join('');\n  buildDen();renderG();renderR();renderP();renderH();hor();\n}\ninit();\n<\/script>\n<\/body>\n<\/html>\n",bebidas:"<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Bebidas<\/title>\n<style>\n:root{--bg:#F1F4EF;--ink:#1D2A21;--mut:#5C6A60;--card:#fff;--line:#D5DDD3;--g:#2E6B45;--gd:#1F4D31;--y:#E3A92B;--r:#B3402F}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,\"Segoe UI\",Roboto,sans-serif;padding-bottom:88px}\n.top{position:sticky;top:0;z-index:5;background:var(--gd);color:#fff;padding:10px 14px}\n.sum{display:grid;grid-template-columns:1fr 1.2fr 1.2fr;gap:8px}\n.sum div{background:rgba(255,255,255,.12);border-radius:10px;padding:6px 10px}\n.sum small{display:block;font-size:13px;opacity:.85}\n.sum strong{font-size:18px}\n.sum .gan{background:var(--y);color:#2b2100}\n.sum .gan.neg{background:var(--r);color:#fff}\nmain{padding:12px;max-width:640px;margin:0 auto}\n.tab{display:none}.tab.on{display:block}\n.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}\nh2{font-size:18px;margin:0 0 8px}\nlabel{display:block;font-size:15px;color:var(--mut);margin:8px 0 4px}\ninput{width:100%;min-height:46px;font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);margin-top:4px}\ninput:focus,button:focus-visible{outline:3px solid var(--y);outline-offset:1px}\nbutton{font:inherit;min-height:46px;padding:8px 14px;border:0;border-radius:10px;background:var(--g);color:#fff;font-weight:600;cursor:pointer}\nbutton.sec{background:#E6ECE4;color:var(--ink)}\nbutton.del{background:transparent;color:var(--r)}\n.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}\n.tot{display:flex;justify-content:space-between;font-weight:700;font-size:19px;margin-top:8px;padding-top:8px;border-top:2px solid var(--line)}\n.sub{color:var(--mut);font-size:15px;font-weight:600}\n.li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}\n.li span{flex:1}\npre{white-space:pre-wrap;font:16px/1.5 ui-monospace,Consolas,monospace;margin:0 0 10px;background:#F6F8F4;border-radius:10px;padding:10px}\n.btns{display:flex;flex-wrap:wrap;gap:8px}\n.hint{font-size:15px;color:var(--mut);margin:4px 0}\nnav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:6px}\nnav button{background:transparent;color:var(--mut)}\nnav button.on{background:var(--g);color:#fff}\n<\/style>\n<\/head>\n<body>\n<div class=\"top\"><div class=\"sum\">\n  <div><small>Vendidas<\/small><strong id=\"vU\">0<\/strong><\/div>\n  <div><small>Ventas<\/small><strong id=\"vV\">$0<\/strong><\/div>\n  <div class=\"gan\" id=\"gb\"><small>Ganancia<\/small><strong id=\"vG\">$0<\/strong><\/div>\n<\/div><\/div>\n<main>\n\n<section class=\"tab on\" id=\"t-hoy\">\n  <div class=\"card\"><label for=\"fecha\" style=\"margin-top:0\">Fecha<\/label><input type=\"date\" id=\"fecha\"><\/div>\n  <p class=\"hint\">Cuenta cu\u00e1ntas hay al empezar (Inicio), cu\u00e1ntas llegaron durante el d\u00eda (Entr\u00f3) y cu\u00e1ntas quedan al final (Quedan). El sistema calcula lo vendido.<\/p>\n  <div id=\"hoy\"><\/div>\n<\/section>\n\n<section class=\"tab\" id=\"t-precios\">\n  <p class=\"hint\">Aqu\u00ed pones el costo de compra y el precio de venta de cada bebida. Tambi\u00e9n puedes cambiar nombres, quitar o agregar productos.<\/p>\n  <div id=\"plist\"><\/div>\n  <div class=\"card\">\n    <h2>Agregar producto<\/h2>\n    <label for=\"an\" style=\"margin-top:0\">Nombre<\/label><input type=\"text\" id=\"an\">\n    <div class=\"two\"><div><label for=\"ac\">Costo<\/label><input type=\"number\" inputmode=\"numeric\" min=\"0\" id=\"ac\"><\/div><div><label for=\"av\">Precio de venta<\/label><input type=\"number\" inputmode=\"numeric\" min=\"0\" id=\"av\"><\/div><\/div>\n    <button id=\"aadd\" style=\"margin-top:10px;width:100%\">Agregar producto<\/button>\n  <\/div>\n<\/section>\n\n<section class=\"tab\" id=\"t-cierre\">\n  <div class=\"card\">\n    <h2>Resultado de bebidas<\/h2>\n    <div class=\"tot\" style=\"border:0;margin:0;padding:0;font-size:17px\"><span>Ventas<\/span><span id=\"sv\">$0<\/span><\/div>\n    <div class=\"tot\" style=\"border:0;margin:0;padding:0;font-size:17px\"><span>Costo de lo vendido<\/span><span id=\"sc\">$0<\/span><\/div>\n    <div class=\"tot\"><span>Ganancia<\/span><span id=\"sg\">$0<\/span><\/div>\n  <\/div>\n  <div class=\"card\">\n    <h2>Caja de bebidas<\/h2>\n    <label for=\"ef\" style=\"margin-top:0\">Efectivo contado<\/label><input type=\"number\" inputmode=\"numeric\" min=\"0\" id=\"ef\" data-c=\"ef\">\n    <label for=\"base\">Base inicial (cambio)<\/label><input type=\"number\" inputmode=\"numeric\" min=\"0\" id=\"base\" data-c=\"base\">\n    <label for=\"tr\">Transferencias (Nequi, Bre-B, bancos)<\/label><input type=\"number\" inputmode=\"numeric\" min=\"0\" id=\"tr\" data-c=\"tr\">\n    <div class=\"tot\"><span>Recibido<\/span><span id=\"rec\">$0<\/span><\/div>\n    <div class=\"tot\" style=\"border:0;margin:0;padding-top:4px\"><span>Contra lo vendido<\/span><span id=\"dif\"><\/span><\/div>\n  <\/div>\n  <div class=\"card\">\n    <h2>Para comprar<\/h2>\n    <div id=\"buy\"><\/div>\n  <\/div>\n  <div class=\"card\">\n    <h2>Informe<\/h2>\n    <pre id=\"rep\"><\/pre>\n    <div class=\"btns\"><button id=\"share\">Enviar por WhatsApp<\/button><button class=\"sec\" id=\"savedia\">Guardar d\u00eda y empezar otro<\/button><\/div>\n    <p class=\"hint\">Al guardar, lo que qued\u00f3 hoy pasa a ser el inicio del pr\u00f3ximo d\u00eda.<\/p>\n  <\/div>\n  <div class=\"card\">\n    <h2>Historial<\/h2>\n    <div id=\"hlist\"><\/div>\n    <div class=\"btns\" style=\"margin-top:10px\"><button class=\"sec\" id=\"exp\">Descargar copia<\/button><button class=\"sec\" id=\"impb\">Restaurar copia<\/button><input type=\"file\" id=\"imp\" accept=\"application/json\" hidden><\/div>\n  <\/div>\n<\/section>\n\n<\/main>\n<nav>\n  <button data-t=\"hoy\" class=\"on\">Hoy<\/button>\n  <button data-t=\"precios\">Precios<\/button>\n  <button data-t=\"cierre\">Cierre<\/button>\n<\/nav>\n\n<script>\nconst KEY='hornado-bebidas-v1';\nconst $=s=>document.querySelector(s);\nconst fmt=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('es-CO');\nconst num=v=>Math.max(0,parseInt(v,10)||0);\nconst esc=t=>String(t).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst iso=()=>new Date().toLocaleDateString('en-CA');\nconst DEF=[['g4','Gaseosa personal 400 ml',3000,0,24],['g1','Gaseosa 1 L',5000,0,12],['g17','Gaseosa 1,7 L',7000,0,12],['a4','Agua personal',2000,0,24]];\nconst def=()=>({prod:DEF.map(a=>({id:a[0],n:a[1],v:a[2],c:a[3],m:a[4]})),day:{fecha:iso(),ini:{},ent:{},fin:{},ef:0,base:0,tr:0},hist:[]});\nconst MAP={k4:'g4',l4:'g4',s4:'g4',k1:'g1',l1:'g1',s1:'g1',k17:'g17',l17:'g17',s17:'g17'};\nfunction migrate(s){\n  const old=s.prod||[];\n  if(s.ver===2||!old.some(p=>MAP[p.id]))return Object.assign(s,{ver:2});\n  const n=def(),d=s.day||{},nd=Object.assign({},n.day,d,{ini:{},ent:{},fin:{}});\n  old.filter(p=>!MAP[p.id]&&p.id!=='a4').forEach(p=>n.prod.push(Object.assign({m:0},p)));\n  old.forEach(p=>{const g=n.prod.find(x=>x.id===(MAP[p.id]||p.id));if(g&&p.c&&!g.c)g.c=p.c});\n  ['ini','ent','fin'].forEach(k=>Object.keys(d[k]||{}).forEach(id=>{const t=MAP[id]||id,v=d[k][id];if(v===''||v===undefined)return;nd[k][t]=(nd[k][t]||0)+v}));\n  return Object.assign({},s,{ver:2,prod:n.prod,day:nd});\n}\nlet S=def();\ntry{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.prod&&s.day)S=migrate(Object.assign(def(),s))}catch(e){}\nconst save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};\n\nfunction row(p){\n  const d=S.day,i=d.ini[p.id]||0,e=d.ent[p.id]||0,f=d.fin[p.id];\n  const done=f!==undefined&&f!=='';\n  return{i,e,f,done,vend:done?Math.max(0,i+e-f):0,over:done&&f>i+e};\n}\nfunction totals(){\n  let u=0,v=0,c=0;\n  S.prod.forEach(p=>{const r=row(p);u+=r.vend;v+=r.vend*p.v;c+=r.vend*p.c});\n  return{u,v,c,g:v-c};\n}\nconst comprar=()=>S.prod.filter(p=>{const r=row(p);return p.m>0&&r.done&&r.f<p.m});\nconst est=d=>(d>0?'Sobra ':d<0?'Falta ':'Cuadra ')+(d?fmt(Math.abs(d)):'');\n\nfunction report(t,rec,dif){\n  const d=S.day,l=['Bebidas - '+d.fecha,'','Vendidas:'];let any=0;\n  S.prod.forEach(p=>{const r=row(p);if(r.vend){any=1;l.push('- '+p.n+': '+r.vend+' x '+fmt(p.v)+' = '+fmt(r.vend*p.v))}});\n  if(!any)l.push('- (nada registrado)');\n  l.push('','Ventas: '+fmt(t.v),'Costo: '+fmt(t.c),'GANANCIA DE BEBIDAS: '+fmt(t.g),'',\n    'Caja de bebidas: efectivo '+fmt(d.ef)+', base -'+fmt(d.base)+', transferencias '+fmt(d.tr),\n    'Recibido: '+fmt(dif+t.v)+' ('+est(dif).toLowerCase()+')','','Quedan:');\n  S.prod.forEach(p=>{const r=row(p);if(r.done)l.push('- '+p.n+': '+r.f)});\n  const bc=comprar();\n  if(bc.length){l.push('','Para comprar:');bc.forEach(p=>l.push('- '+p.n+': quedan '+row(p).f+' (m\u00ednimo '+p.m+')'))}\n  return l.join('\\n');\n}\n\nfunction calc(){\n  const t=totals(),d=S.day;\n  S.prod.forEach(p=>{\n    const r=row(p),el=$('#r-'+p.id);if(!el)return;\n    el.textContent=r.done?'Vendidas: '+r.vend:'Falta contar';\n    const w=$('#w-'+p.id),low=p.m>0&&r.done&&r.f<p.m&&p.v&&!r.over;\n    w.textContent=!p.v?'Falta el precio de venta (pesta\u00f1a Precios).':r.over?'Revisa: quedan m\u00e1s de las que hab\u00eda.':low?'Comprar: quedan '+r.f+' y el m\u00ednimo es '+p.m+'.':'';\n    w.style.cssText=low?'color:var(--r);font-weight:700':'';\n  });\n  const rec=d.ef-d.base+d.tr,dif=rec-t.v;\n  $('#vU').textContent=t.u;$('#vV').textContent=fmt(t.v);$('#vG').textContent=fmt(t.g);\n  $('#gb').classList.toggle('neg',t.g<0);\n  $('#sv').textContent=fmt(t.v);$('#sc').textContent=fmt(t.c);$('#sg').textContent=fmt(t.g);\n  $('#rec').textContent=fmt(rec);$('#dif').textContent=est(dif);\n  const bc=comprar();\n  $('#buy').innerHTML=bc.length?bc.map(p=>`<div class=\"li\"><span>${esc(p.n)}<\/span><b>Quedan ${row(p).f}<\/b><\/div>`).join('')+'<p class=\"hint\">Estas bebidas est\u00e1n por debajo de su m\u00ednimo.<\/p>':'<p class=\"hint\">Nada por comprar por ahora. Se actualiza cuando cuentas lo que qued\u00f3 en Quedan.<\/p>';\n  $('#rep').textContent=report(t,rec,dif);\n  save();\n}\n\nfunction renderHoy(){\n  const d=S.day,vl=(o,id)=>o[id]===undefined||o[id]===''?'':o[id];\n  const inp=(k,id)=>`<input type=\"number\" inputmode=\"numeric\" min=\"0\" data-k=\"${k}\" data-p=\"${id}\" value=\"${vl(d[k],id)}\">`;\n  $('#hoy').innerHTML=S.prod.map(p=>`<div class=\"card\"><div class=\"tot\" style=\"margin:0;padding:0;border:0;font-size:17px\"><span>${esc(p.n)}<\/span><span class=\"sub\" id=\"r-${p.id}\"><\/span><\/div><div class=\"three\"><label>Inicio${inp('ini',p.id)}<\/label><label>Entr\u00f3${inp('ent',p.id)}<\/label><label>Quedan${inp('fin',p.id)}<\/label><\/div><p class=\"hint\" id=\"w-${p.id}\"><\/p><\/div>`).join('');\n  calc();\n}\nfunction renderP(){\n  $('#plist').innerHTML=S.prod.map(p=>`<div class=\"card\"><label style=\"margin-top:0\">Producto<input type=\"text\" data-pn=\"${p.id}\" value=\"${esc(p.n)}\"><\/label><div class=\"two\"><label>Costo (compra)<input type=\"number\" inputmode=\"numeric\" min=\"0\" data-pc=\"${p.id}\" value=\"${p.c||''}\"><\/label><label>Precio de venta<input type=\"number\" inputmode=\"numeric\" min=\"0\" data-pv=\"${p.id}\" value=\"${p.v||''}\"><\/label><\/div><label>Avisar para comprar cuando queden menos de<input type=\"number\" inputmode=\"numeric\" min=\"0\" data-pm=\"${p.id}\" value=\"${p.m||''}\"><\/label><button class=\"del\" data-pd=\"${p.id}\">Quitar producto<\/button><\/div>`).join('');\n}\nfunction renderH(){\n  $('#hlist').innerHTML=S.hist.length?S.hist.slice().reverse().map(h=>`<div class=\"li\"><span><b>${esc(h.fecha)}<\/b><br><small>Ventas ${fmt(h.v)}<\/small><\/span><b>${fmt(h.g)}<\/b><button class=\"del\" data-hd=\"${esc(h.fecha)}\">Borrar<\/button><\/div>`).join(''):'<p class=\"hint\">A\u00fan no hay d\u00edas guardados.<\/p>';\n}\nfunction show(t){\n  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.id==='t-'+t));\n  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));\n  if(t==='hoy')renderHoy();\n  scrollTo(0,0);\n}\n\ndocument.addEventListener('input',e=>{\n  const i=e.target,d=S.day,D=i.dataset;\n  if(D.k){d[D.k][D.p]=i.value===''?'':num(i.value);return calc()}\n  if(D.c){d[D.c]=num(i.value);return calc()}\n  const id=D.pn||D.pc||D.pv||D.pm;\n  if(id){const p=S.prod.find(x=>x.id==id);if(D.pn)p.n=i.value;else if(D.pc)p.c=num(i.value);else if(D.pm)p.m=num(i.value);else p.v=num(i.value);calc()}\n});\ndocument.addEventListener('click',e=>{\n  const b=e.target.closest('button');if(!b)return;\n  const D=b.dataset;\n  if(D.t)return show(D.t);\n  if(D.pd){if(confirm('\u00bfQuitar este producto de la lista?')){S.prod=S.prod.filter(p=>p.id!==D.pd);renderP();calc()}return}\n  if(D.hd){if(confirm('\u00bfBorrar este d\u00eda del historial?')){S.hist=S.hist.filter(h=>h.fecha!==D.hd);save();renderH()}}\n});\n$('#fecha').onchange=e=>{S.day.fecha=e.target.value||iso();calc()};\n$('#aadd').onclick=()=>{\n  const n=$('#an').value.trim();if(!n){$('#an').focus();return}\n  S.prod.push({id:'x'+Date.now(),n,c:num($('#ac').value),v:num($('#av').value)});\n  $('#an').value='';$('#ac').value='';$('#av').value='';renderP();calc();\n};\n$('#share').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent($('#rep').textContent),'_blank');\n$('#savedia').onclick=()=>{\n  if(!confirm('\u00bfGuardar el d\u00eda y empezar uno nuevo? Lo que qued\u00f3 hoy ser\u00e1 el inicio del pr\u00f3ximo d\u00eda.'))return;\n  const t=totals(),d=S.day;\n  S.hist=S.hist.filter(h=>h.fecha!==d.fecha);\n  S.hist.push({fecha:d.fecha,u:t.u,v:t.v,c:t.c,g:t.g});\n  S.hist.sort((a,b)=>a.fecha<b.fecha?-1:1);\n  const ini={};\n  S.prod.forEach(p=>{const r=row(p);ini[p.id]=r.done?r.f:r.i+r.e});\n  S.day={fecha:iso(),ini,ent:{},fin:{},ef:0,base:0,tr:0};\n  ['ef','base','tr'].forEach(k=>$('#'+k).value='');\n  save();renderHoy();renderH();\n};\n$('#exp').onclick=()=>{\n  const a=document.createElement('a');\n  a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));\n  a.download='copia-bebidas-'+iso()+'.json';a.click();\n};\n$('#impb').onclick=()=>$('#imp').click();\n$('#imp').onchange=e=>{\n  const f=e.target.files[0];if(!f)return;\n  const r=new FileReader();\n  r.onload=()=>{try{const s=JSON.parse(r.result);if(!Array.isArray(s.prod)||!s.day)throw 0;S=migrate(Object.assign(def(),s));save();init();alert('Copia restaurada')}catch(x){alert('El archivo no es una copia v\u00e1lida')}};\n  r.readAsText(f);\n};\nfunction init(){\n  $('#fecha').value=S.day.fecha;\n  ['ef','base','tr'].forEach(k=>$('#'+k).value=S.day[k]||'');\n  renderP();renderH();renderHoy();\n}\ninit();\n<\/script>\n<\/body>\n<\/html>\n"};
const V=[['pedidos','Pedidos'],['caja','Cierre de caja'],['bebidas','Bebidas']];
const $=s=>document.querySelector(s);
V.forEach(v=>{const f=document.createElement('iframe');f.id='f-'+v[0];f.title=v[1];f.setAttribute('allow','web-share');f.srcdoc=DOCS[v[0]];$('#frames').appendChild(f)});
$('#items').innerHTML=V.map(v=>`<button data-v="${v[0]}">${v[1]}</button>`).join('');
const menu=o=>{document.body.classList.toggle('open',o);$('#menu').setAttribute('aria-label',o?'Cerrar menú':'Abrir menú')};
function go(id){
  document.querySelectorAll('iframe').forEach(f=>f.classList.toggle('on',f.id==='f-'+id));
  document.querySelectorAll('#items button').forEach(b=>b.classList.toggle('on',b.dataset.v===id));
  $('#ttl').textContent=V.find(v=>v[0]===id)[1];
  try{localStorage.setItem('hornado-vista',id)}catch(e){}
  menu(false);
}
$('#menu').onclick=()=>menu(!document.body.classList.contains('open'));
$('#scrim').onclick=()=>menu(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape')menu(false)});
$('#items').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)};
let ini='pedidos';try{ini=localStorage.getItem('hornado-vista')||ini}catch(e){}
go(DOCS[ini]?ini:'pedidos');
</script>
</body>
